name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pytest PyYAML opencv-python-headless
      - name: Run unit tests
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: pytest -q tests
      - name: Check published study evidence
        run: python scripts/check_results.py
